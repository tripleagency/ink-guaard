<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders – Ink Guard Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="admin.css" rel="stylesheet" />
</head>
<body>

<button class="sidebar-toggle" onclick="toggleSidebar()">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="admin-layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div><div class="logo-text">INK GUARD</div><span class="admin-badge">Admin</span></div></div>
    <div class="sidebar-section">Main</div>
    <a href="index.html"      class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Overview</a>
    <a href="orders.html"     class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 0 2-2h2a2 2 0 0 0 2 2"/></svg>Orders<span class="nav-badge">12</span></a>
    <a href="reports.html"    class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Reports</a>
    <div class="sidebar-section">Catalog</div>
    <a href="products.html"   class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>Products</a>
    <a href="categories.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M14.5 5.5l4 4"/></svg>Categories</a>
    <div class="sidebar-section">Users</div>
    <a href="users.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</a>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="sidebar-avatar">AM</div>
        <div><div class="sidebar-user-name">Ahmed M.</div><div class="sidebar-user-role">Super Admin</div></div>
        <a href="../login.html" style="margin-left:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></a>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <div><div class="topbar-title">Orders</div><div class="topbar-breadcrumb">Dashboard / Orders</div></div>
      <div class="topbar-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Order # or customer…" oninput="filterOrders(this.value)" />
      </div>
      <button class="btn-admin-outline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
    </div>

    <div class="page-content">

      <!-- Status filter tabs -->
      <div class="d-flex gap-2 flex-wrap mb-4">
        <button class="btn-admin-primary" id="tab-all" onclick="setTab('all',this)">All Orders <span style="background:#333; color:#fff; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">347</span></button>
        <button class="btn-admin-outline" id="tab-pending"    onclick="setTab('Pending',this)">Pending <span style="background:#fef9c3; color:#854d0e; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">12</span></button>
        <button class="btn-admin-outline" id="tab-processing" onclick="setTab('Processing',this)">Processing <span style="background:#dbeafe; color:#1e40af; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">28</span></button>
        <button class="btn-admin-outline" id="tab-shipped"    onclick="setTab('Shipped',this)">Shipped <span style="background:#dcfce7; color:#166534; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">64</span></button>
        <button class="btn-admin-outline" id="tab-delivered"  onclick="setTab('Delivered',this)">Delivered <span style="background:#dcfce7; color:#166534; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">231</span></button>
        <button class="btn-admin-outline" id="tab-cancelled"  onclick="setTab('Cancelled',this)">Cancelled <span style="background:#fee2e2; color:#991b1b; padding:1px 8px; border-radius:50px; font-size:.7rem; margin-left:4px;">12</span></button>
      </div>

      <div class="admin-card">
        <div class="filter-row">
          <select class="admin-select" style="width:auto;">
            <option>All Governorates</option>
            <option>Cairo</option>
            <option>Alexandria</option>
            <option>Giza</option>
          </select>
          <select class="admin-select" style="width:auto;">
            <option>All Payment Methods</option>
            <option>Credit Card</option>
            <option>Cash on Delivery</option>
            <option>InstaPay</option>
          </select>
          <input type="date" class="admin-input" style="width:auto;" />
          <div style="margin-left:auto; font-size:.75rem; color:#888;" id="orderCount">347 orders</div>
        </div>

        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th><input type="checkbox" /></th>
                <th>Order</th>
                <th>Customer</th>
                <th>Date</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>

        <div class="d-flex align-items-center justify-content-between p-3 flex-wrap gap-2" style="border-top:1px solid var(--border);">
          <span style="font-size:.75rem; color:#888;">Showing 1–10 of 347</span>
          <div class="pagination-admin">
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-backdrop-admin" id="orderModal">
  <div class="modal-admin" style="max-width:600px;">
    <div class="modal-header-admin">
      <div>
        <div class="modal-title-admin" id="orderModalTitle">Order #IG-04821</div>
        <div style="font-size:.72rem; color:#aaa;" id="orderModalDate">March 18, 2026</div>
      </div>
      <button class="modal-close" onclick="closeOrderModal()">×</button>
    </div>
    <div class="modal-body-admin" id="orderModalBody">
      <!-- Injected by JS -->
    </div>
    <div class="modal-footer-admin">
      <button class="btn-admin-outline" onclick="closeOrderModal()">Close</button>
      <button class="btn-admin-yellow" onclick="closeOrderModal()">Update Status</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const orders = [
    { id:'IG-04821', customer:'Ahmed Mohamed',  email:'ahmed@mail.com', date:'Mar 18, 2026', items:2, total:435, payment:'Credit Card',   status:'Delivered',  gov:'Cairo'      },
    { id:'IG-04820', customer:'Sara Khaled',    email:'sara@mail.com',  date:'Mar 18, 2026', items:1, total:229, payment:'InstaPay',       status:'Shipped',    gov:'Giza'       },
    { id:'IG-04819', customer:'Mohamed Ali',    email:'m@mail.com',     date:'Mar 17, 2026', items:3, total:680, payment:'Cash on Delivery',status:'Processing', gov:'Cairo'      },
    { id:'IG-04818', customer:'Layla Hassan',   email:'l@mail.com',     date:'Mar 17, 2026', items:1, total:349, payment:'Credit Card',   status:'Delivered',  gov:'Alexandria' },
    { id:'IG-04817', customer:'Omar Farouk',    email:'o@mail.com',     date:'Mar 16, 2026', items:4, total:918, payment:'Credit Card',   status:'Cancelled',  gov:'Cairo'      },
    { id:'IG-04816', customer:'Nour Ibrahim',   email:'n@mail.com',     date:'Mar 16, 2026', items:2, total:458, payment:'InstaPay',       status:'Delivered',  gov:'Cairo'      },
    { id:'IG-04815', customer:'Karim Samir',    email:'k@mail.com',     date:'Mar 15, 2026', items:1, total:199, payment:'Cash on Delivery',status:'Delivered', gov:'Giza'       },
    { id:'IG-04814', customer:'Dina Waheed',    email:'d@mail.com',     date:'Mar 15, 2026', items:2, total:388, payment:'Credit Card',   status:'Shipped',    gov:'Alexandria' },
    { id:'IG-04813', customer:'Youssef Nasser', email:'y@mail.com',     date:'Mar 14, 2026', items:1, total:159, payment:'InstaPay',       status:'Pending',   gov:'Cairo'      },
    { id:'IG-04812', customer:'Rania Adel',     email:'r@mail.com',     date:'Mar 14, 2026', items:3, total:587, payment:'Credit Card',   status:'Processing', gov:'Cairo'      },
  ];

  let filtered = [...orders];
  let activeTab = 'all';

  const statusBadge = s => {
    if (s==='Delivered')  return '<span class="badge-admin badge-green">● Delivered</span>';
    if (s==='Shipped')    return '<span class="badge-admin badge-blue">▲ Shipped</span>';
    if (s==='Processing') return '<span class="badge-admin badge-yellow">⏳ Processing</span>';
    if (s==='Pending')    return '<span class="badge-admin badge-gray">○ Pending</span>';
    if (s==='Cancelled')  return '<span class="badge-admin badge-red">✕ Cancelled</span>';
    return '<span class="badge-admin badge-gray">' + s + '</span>';
  };

  function renderOrders(data) {
    const body = document.getElementById('ordersBody');
    body.innerHTML = data.map(o => `
      <tr>
        <td><input type="checkbox" /></td>
        <td style="font-weight:700; font-size:.83rem; color:#111;">${o.id}</td>
        <td>
          <div style="font-weight:500; font-size:.82rem;">${o.customer}</div>
          <div style="font-size:.72rem; color:#aaa;">${o.email}</div>
        </td>
        <td style="font-size:.8rem; color:#666;">${o.date}</td>
        <td style="font-size:.82rem;">${o.items} item${o.items>1?'s':''}</td>
        <td style="font-weight:700; font-size:.85rem;">${o.total} EGP</td>
        <td style="font-size:.78rem; color:#666;">${o.payment}</td>
        <td>${statusBadge(o.status)}</td>
        <td>
          <div class="d-flex gap-1">
            <button class="btn-icon success" title="View Order" onclick="viewOrder('${o.id}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="btn-icon" title="Print Invoice">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            </button>
            <button class="btn-icon danger" title="Cancel">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  renderOrders(orders);

  function setTab(tab, btn) {
    activeTab = tab;
    document.querySelectorAll('[id^="tab-"]').forEach(b => {
      b.className = b === btn ? 'btn-admin-primary' : 'btn-admin-outline';
    });
    filtered = tab === 'all' ? [...orders] : orders.filter(o => o.status === tab);
    renderOrders(filtered);
  }

  function filterOrders(q) {
    const list = activeTab === 'all' ? orders : orders.filter(o => o.status === activeTab);
    filtered = list.filter(o => o.id.toLowerCase().includes(q.toLowerCase()) || o.customer.toLowerCase().includes(q.toLowerCase()));
    renderOrders(filtered);
  }

  function viewOrder(id) {
    const o = orders.find(x => x.id === id);
    document.getElementById('orderModalTitle').textContent = 'Order #' + o.id;
    document.getElementById('orderModalDate').textContent  = o.date;
    document.getElementById('orderModalBody').innerHTML = `
      <div class="row g-3 mb-4">
        <div class="col-6">
          <div style="background:#fafafa; border-radius:8px; padding:14px;">
            <p style="font-size:.7rem; font-weight:700; color:#aaa; margin-bottom:8px; text-transform:uppercase;">Customer</p>
            <p style="font-size:.85rem; font-weight:600; margin-bottom:2px;">${o.customer}</p>
            <p style="font-size:.78rem; color:#888; margin:0;">${o.email}</p>
          </div>
        </div>
        <div class="col-6">
          <div style="background:#fafafa; border-radius:8px; padding:14px;">
            <p style="font-size:.7rem; font-weight:700; color:#aaa; margin-bottom:8px; text-transform:uppercase;">Shipping</p>
            <p style="font-size:.85rem; font-weight:600; margin-bottom:2px;">${o.gov}, Egypt</p>
            <p style="font-size:.78rem; color:#888; margin:0;">Standard Delivery</p>
          </div>
        </div>
      </div>
      <p style="font-size:.78rem; font-weight:700; color:#aaa; margin-bottom:10px; text-transform:uppercase;">Order Items</p>
      <div style="border:1.5px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:16px;">
        <table style="width:100%; border-collapse:collapse; font-size:.82rem;">
          <tr style="background:#fafafa;"><th style="padding:10px 14px; text-align:left; color:#888; font-size:.72rem;">Product</th><th style="padding:10px 14px; text-align:right; color:#888; font-size:.72rem;">Qty</th><th style="padding:10px 14px; text-align:right; color:#888; font-size:.72rem;">Price</th></tr>
          <tr><td style="padding:12px 14px;">Toner Powder – Magenta</td><td style="padding:12px 14px; text-align:right;">1</td><td style="padding:12px 14px; text-align:right; font-weight:600;">229 EGP</td></tr>
          ${o.items > 1 ? `<tr style="border-top:1px solid #f0f0f0;"><td style="padding:12px 14px;">Toner Powder – Yellow</td><td style="padding:12px 14px; text-align:right;">${o.items-1}</td><td style="padding:12px 14px; text-align:right; font-weight:600;">${o.total - 229} EGP</td></tr>` : ''}
        </table>
      </div>
      <div style="background:#fafafa; border-radius:8px; padding:14px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:.82rem;"><span style="color:#888;">Subtotal</span><span>${o.total + 50} EGP</span></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:.82rem;"><span style="color:#888;">Discount</span><span style="color:#e0187a;">-50 EGP</span></div>
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:.82rem;"><span style="color:#888;">Shipping</span><span>0 EGP</span></div>
        <div style="display:flex; justify-content:space-between; font-size:.88rem; font-weight:700; border-top:1px solid var(--border); padding-top:10px; margin-top:8px;"><span>Total</span><span>${o.total} EGP</span></div>
      </div>
      <div class="mt-3">
        <label class="admin-label">Update Status</label>
        <select class="admin-select" id="statusSelect"><option ${o.status==='Pending'?'selected':''}>Pending</option><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Shipped'?'selected':''}>Shipped</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select>
      </div>
    `;
    document.getElementById('orderModal').classList.add('open');
  }

  function closeOrderModal() { document.getElementById('orderModal').classList.remove('open'); }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  }
</script>
</body>
</html>
