<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Ink Guard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <style>
    .notfound-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
      position: relative;
      overflow: hidden;
    }

    .notfound-page::before {
      content: '';
      position: absolute;
      top: -100px; left: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, #e0187a22 0%, transparent 70%);
      border-radius: 50%;
    }

    .notfound-page::after {
      content: '';
      position: absolute;
      bottom: -100px; right: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, #3dd4c822 0%, transparent 70%);
      border-radius: 50%;
    }

    .notfound-number {
      font-size: clamp(8rem, 22vw, 18rem);
      font-weight: 900;
      color: #1a1a1a;
      line-height: 1;
      user-select: none;
      position: relative;
      z-index: 1;
    }

    .notfound-number span { color: #e8f071; }

    .notfound-content {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .quick-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .quick-link {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; border: 1.5px solid #333;
      border-radius: 50px; color: #aaa; text-decoration: none;
      font-size: .82rem; transition: .2s;
    }
    .quick-link:hover { border-color: #e8f071; color: #e8f071; }
  </style>
</head>
<body>

  <div class="notfound-page">

    <!-- NAVBAR -->
    <nav class="navbar py-3 position-relative" style="z-index:10; background:transparent; border-bottom:1px solid #1a1a1a;">
      <div class="container-fluid px-4 px-lg-5">
        <a class="navbar-brand fw-black text-white" href="index.html">INK GUARD</a>
        <div class="ms-auto d-flex gap-4">
          <a class="nav-link text-white" style="opacity:.6; font-size:.85rem;" href="shop.html">Shop</a>
          <a class="nav-link text-white" style="opacity:.6; font-size:.85rem;" href="contact.html">Contact</a>
        </div>
      </div>
    </nav>

    <!-- CONTENT -->
    <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center px-4 py-5">

      <!-- Big 404 -->
      <div class="notfound-number">4<span>0</span>4</div>

      <!-- Message -->
      <div class="notfound-content mt-4 mb-5">
        <h1 class="fw-black text-white mb-3" style="font-size:clamp(1.4rem,3vw,2rem);">
          Page not found
        </h1>
        <p class="text-muted mb-5" style="font-size:.9rem; max-width:380px; margin:0 auto;">
          Looks like this cartridge is empty. The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="index.html" class="btn-yellow-pill" style="padding:13px 32px; font-size:.9rem;">
          Go Home
        </a>
      </div>

      <!-- Quick links -->
      <div class="quick-links">
        <a href="shop.html" class="quick-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Shop Products
        </a>
        <a href="services.html" class="quick-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          Our Services
        </a>
        <a href="about.html" class="quick-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          About Us
        </a>
        <a href="recycle.html" class="quick-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          Recycle Program
        </a>
        <a href="contact.html" class="quick-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          Contact
        </a>
      </div>

    </div>

    <!-- Watermark -->
    <div class="footer-watermark" style="color:#111; text-align:center; padding-bottom:0;">INK GUARD</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
